[project]
name = "ai-video-editor"
version = "0.1.0"
description = "Claude Code video editing workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    # video-use helper deps
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    # local, offline transcription on Apple Silicon (Linux: `uv sync --group asr`)
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # subtitle tooling
    "pysrt",
    "playwright>=1.63.0",
    # brand file validation (tools/brand_files.py): fonts incl. WOFF2, SVG without DTD/entities
    "fonttools>=4.66.1",
    "brotli>=1.2.1",
    "defusedxml>=0.7.1",
    # the site capture's pinned-address fetch (tools/site_guard.py)
    "urllib3>=2.8.0",
]

[tool.uv]
package = false

[dependency-groups]
# local text-to-speech for tools/gen/voice.py (Kokoro-82M: MLX on Apple Silicon, PyTorch CPU on
# Linux); `uv sync --group gen`
gen = [
    "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro==0.9.4; sys_platform == 'linux'",
    # direct so [tool.uv.sources] applies: CPU wheels on Linux, PyPI (as before) elsewhere
    "torch",
    "misaki[en]==0.9.4",
    # spaCy model misaki uses for English; pinned so misaki doesn't install it at runtime
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# paid generators on fal.ai for tools/gen/{keyframes,animate,library}.py (opt-in: needs FAL_API_KEY
# in vendor/video-use/.env). Run them with `uv run --group cloud …`; uv run's inexact sync keeps `gen`.
cloud = [
    "fal-client==1.0.3",
]
# CPU transcription for tools/transcribe_local.py off Apple Silicon (faster-whisper on CTranslate2)
asr = [
    "faster-whisper==1.2.1; sys_platform == 'linux'",
]
# person matte for tools/person_matte.py off macOS (MediaPipe selfie segmenter)
matte = [
    "mediapipe==1.2.0; sys_platform == 'linux'",
]

# Linux torch comes from the CPU wheel index; PyPI's default Linux build pulls several GB of CUDA
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

# the second entry keeps every other platform on PyPI, exactly as before
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pypi", marker = "sys_platform != 'linux'" },
]

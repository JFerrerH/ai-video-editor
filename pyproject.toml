[project]
name = "ai-video-editor"
version = "0.1.0"
description = "Claude Code video editing workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    # video-use helper deps
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    # local, offline transcription on Apple Silicon
    "mlx-whisper",
    # subtitle tooling
    "pysrt",
    "playwright>=1.63.0",
]

[tool.uv]
package = false

[dependency-groups]
# local text-to-speech for tools/gen/voice.py (Kokoro-82M on MLX); `uv sync --group gen`
gen = [
    "mlx-audio==0.6.1",
    "misaki[en]==0.9.4",
    # spaCy model misaki uses for English; pinned so misaki doesn't install it at runtime
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
